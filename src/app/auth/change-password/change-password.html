<div class="change-container">
    <div class="mb-4 p-8">

        <form [formGroup]="resetPasswordForm">
            <p-card header="Reset Password" subheader="forget password? no worries, just enter your Email">
                <p-floatlabel variant="on">
                    <input pInputText id="on_label" autocomplete="off" formControlName="email" />
                    <label for="on_label">Email</label>
                </p-floatlabel>

                <p-button label="Send OTP" (onClick)="sendOtp()" />
            </p-card>

            <div *ngIf="showPasswordSection">

                <p-card header="Change Password"
                    subheader="Please enter the OTP sent to your email and your new password.">
                    <p-floatlabel variant="on">
                        <input pInputText id="otp" autocomplete="off" formControlName="otp" />
                        <label for="otp">OTP</label>
                    </p-floatlabel>
                    <p-floatlabel variant="on">
                        <input pInputText id="new_password" autocomplete="off" formControlName="newPassword" />
                        <label for="new_password">New Password</label>
                    </p-floatlabel>
                    <p-floatlabel variant="on">
                        <input pInputText id="confirm_password" autocomplete="off" formControlName="confirmPassword" />
                        <label for="confirm_password">Confirm Password</label>
                    </p-floatlabel>

                    <p-button label="Change Password" (onClick)="changePassword()" />
                </p-card>
                <span><a routerLink="/login">Back to Login</a></span>

            </div>
        </form>
    </div>
</div>
